name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - surajsk70743/set-up-this-codebase-for-DZu725

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck, lint, scans and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Crawling stays off in CI builds (Phase 3). No secrets are used anywhere
      # in this workflow; the translation script is never run here.
      ALLOW_INDEXING: "false"

    steps:
      # Actions are pinned to full commit SHAs (tag in the trailing comment).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      # Node 22 = the Railway image (Dockerfile: node:22-bookworm-slim), so CI
      # builds and tests the runtime that ships. (The action itself runs on
      # its own Node 24; this only selects the job's Node.)
      - name: Set up Node 22 with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24)
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan (API-key-like strings in tracked files)
        run: npm run check:secrets

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Design tokens (no hard-coded hex/px outside token files)
        run: npm run check:tokens

      - name: Validate translations (locale key parity + stored market translations)
        run: npm run validate:translations

      # Proves the build checks below catch planted leaks (and pass a clean
      # fixture) before trusting them on the real build.
      - name: Build-check self-tests
        run: npm run test:verify-build

      # db:backup with a stub CLI: private files, checksums, never prints the URL.
      - name: Backup script self-tests
        run: npm run test:db-backup

      - name: Build
        run: npm run build

      # On failure it prints file :: pattern name :: masked context for every
      # finding (secret-shaped values are never printed).
      - name: Verify build output
        run: bash scripts/verify-build.sh .next

      # The Railway image (D-025): builds with placeholder public values only,
      # starts as non-root on $PORT, and must answer the healthcheck.
      - name: Docker image builds and passes the healthcheck
        run: |
          docker build -t bharatpredict-ci \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder .
          docker run -d --name bp -p 3300:3300 -e PORT=3300 bharatpredict-ci
          for i in $(seq 1 30); do curl -sf http://localhost:3300/api/health && break; sleep 2; done
          curl -sf http://localhost:3300/api/health | grep -q '"ok":true'
          test "$(docker exec bp id -u)" != "0"
          docker rm -f bp

  supabase:
    name: Database (pgTAP) and end-to-end tests on a local Supabase
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      ALLOW_INDEXING: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false

      # Node 22 = the Railway image (Dockerfile: node:22-bookworm-slim), so CI
      # builds and tests the runtime that ships. (The action itself runs on
      # its own Node 24; this only selects the job's Node.)
      - name: Set up Node 22 with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (node24)
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Local Supabase from supabase/config.toml (CLI pinned in package.json).
      # Only the services the tests use; nothing here is a secret: the keys
      # are the CLI's fixed local-development keys.
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime

      - name: pgTAP (supabase/tests)
        run: npx supabase test db

      - name: Export local Supabase endpoints for the auth e2e
        run: |
          npx supabase status -o env > "$RUNNER_TEMP/sb.env"
          set -a; . "$RUNNER_TEMP/sb.env"; set +a
          # Local stack only. The legacy JWT keys are used for tests because the
          # helpers call the Auth admin API with a Bearer token.
          {
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "E2E_SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_MAILPIT_URL=${MAILPIT_URL:-$INBUCKET_URL}"
          } >> "$GITHUB_ENV"

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      # Both suites build the app against the LOCAL stack only
      # (tests/support/local-supabase.ts) and read sign-in codes from its
      # mail catcher. Main suite: email codes on. Auth suite: production
      # setting (Google only).
      - name: End-to-end tests
        run: npm run test:e2e

      - name: End-to-end tests (Google-only sign-in build)
        run: npm run test:e2e:auth

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

