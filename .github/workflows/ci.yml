name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, build and e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Crawling stays off in CI builds (Phase 3). No secrets are used anywhere
      # in this workflow; the translation script is never run here.
      ALLOW_INDEXING: "false"

    steps:
      # Actions are pinned to full commit SHAs (tag in the trailing comment).
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node (LTS) with npm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan (API-key-like strings in tracked files)
        run: npm run check:secrets

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate translations (locale key parity + stored market translations)
        run: npm run validate:translations

      - name: Build
        run: npm run build

      - name: Verify build output
        run: bash scripts/verify-build.sh .next

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds with the e2e-only flag and serves it itself.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
